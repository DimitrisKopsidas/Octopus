name: Production deployment

on:
  push:
    branches:
      - "**"

permissions: {}

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  backup-database:
    name: Back up production database
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      SSH_USERNAME: ${{ secrets.PRODUCTION_SSH_USERNAME }}
      SSHPASS: ${{ secrets.PRODUCTION_SSH_PASSWORD }}
      S3_BUCKET: ${{ vars.PRODUCTION_S3_BUCKET }}
      AWS_REGION: ${{ vars.PRODUCTION_AWS_REGION }}

    steps:
      - name: Validate SSH configuration
        run: |
          for name in SSH_HOST SSH_USERNAME SSHPASS S3_BUCKET AWS_REGION; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required production configuration: $name"
              exit 1
            fi
          done

      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o "${RUNNER_TEMP}/cloudflared"
          chmod +x "${RUNNER_TEMP}/cloudflared"

      - name: Create database dump on VM
        run: |
          sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new \
            -o "ProxyCommand=${RUNNER_TEMP}/cloudflared access ssh --hostname %h" \
            "${SSH_USERNAME}@${SSH_HOST}" \
            "S3_BUCKET='$S3_BUCKET' AWS_REGION='$AWS_REGION' bash -se" <<'REMOTE_SCRIPT'
          umask 077

          BACKUP_FILE="$HOME/octopus-$(date -u +%Y%m%dT%H%M%SZ).dump"

          docker exec octopus-db-1 sh -c '
            exec pg_dump \
              --format=custom \
              --no-owner \
              --no-acl \
              --username="$POSTGRES_USER" \
              --dbname="$POSTGRES_DB"
          ' > "$BACKUP_FILE"

          test -s "$BACKUP_FILE"
          docker exec -i octopus-db-1 pg_restore --list < "$BACKUP_FILE" > /dev/null

          echo "Database backup created: $BACKUP_FILE"

          aws s3 cp \
            "$BACKUP_FILE" \
            "s3://${S3_BUCKET}/postgres/$(basename "$BACKUP_FILE")" \
            --region "$AWS_REGION" \
            --only-show-errors

          echo "Database backup uploaded to S3."
          REMOTE_SCRIPT
