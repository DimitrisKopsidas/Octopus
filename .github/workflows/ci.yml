name: Production deployment

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Back up database and deploy
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      SSH_USERNAME: ${{ secrets.PRODUCTION_SSH_USERNAME }}
      SSHPASS: ${{ secrets.PRODUCTION_SSH_PASSWORD }}
      S3_BUCKET: ${{ vars.PRODUCTION_S3_BUCKET }}
      AWS_REGION: ${{ vars.PRODUCTION_AWS_REGION }}
      APP_PATH: ${{ vars.PRODUCTION_APP_PATH }}
      DEPLOY_SHA: ${{ github.sha }}

    steps:
      - name: Validate SSH configuration
        run: |
          for name in SSH_HOST SSH_USERNAME SSHPASS S3_BUCKET AWS_REGION APP_PATH; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required production configuration: $name"
              exit 1
            fi
          done

      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o "${RUNNER_TEMP}/cloudflared"
          chmod +x "${RUNNER_TEMP}/cloudflared"

      - name: Back up database and deploy on VM
        run: |
          sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new \
            -o "ProxyCommand=${RUNNER_TEMP}/cloudflared access ssh --hostname %h" \
            "${SSH_USERNAME}@${SSH_HOST}" \
            "S3_BUCKET='$S3_BUCKET' AWS_REGION='$AWS_REGION' APP_PATH='$APP_PATH' DEPLOY_SHA='$DEPLOY_SHA' bash -se" <<'REMOTE_SCRIPT'
          umask 077

          BACKUP_FILE="$HOME/octopus-$(date -u +%Y%m%dT%H%M%SZ).dump"

          docker exec octopus-db-1 sh -c '
            exec pg_dump \
              --format=custom \
              --no-owner \
              --no-acl \
              --username="$POSTGRES_USER" \
              --dbname="$POSTGRES_DB"
          ' > "$BACKUP_FILE"

          test -s "$BACKUP_FILE"
          docker exec -i octopus-db-1 pg_restore --list < "$BACKUP_FILE" > /dev/null

          echo "Database backup created: $BACKUP_FILE"

          aws s3 cp \
            "$BACKUP_FILE" \
            "s3://${S3_BUCKET}/postgres/$(basename "$BACKUP_FILE")" \
            --region "$AWS_REGION" \
            --only-show-errors

          echo "Database backup uploaded to S3."

          cd "$APP_PATH"
          git fetch --prune origin
          git checkout --detach "$DEPLOY_SHA"
          docker compose up -d --build

          for attempt in {1..12}; do
            if curl --fail --silent "http://localhost:8080/api/v1/healthz" > /dev/null; then
              echo "Backend health check passed."
              break
            fi

            if [[ "$attempt" -eq 12 ]]; then
              echo "Backend health check failed."
              exit 1
            fi

            sleep 5
          done

          echo "Deployed commit: $DEPLOY_SHA"
          REMOTE_SCRIPT
