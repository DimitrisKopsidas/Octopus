spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

app.readonly=${APP_READONLY:false}

app.image.upload-dir=${APP_IMAGE_UPLOAD_DIR:/var/www/octopus/images}
app.image.base-url=${APP_IMAGE_BASE_URL:https://octopus.kerberos.network/images}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://octopus.kerberos.network}