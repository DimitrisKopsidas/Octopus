spring.application.name=octopus
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:dimitris}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.image.upload-dir=${APP_IMAGE_UPLOAD_DIR:S:/temp}
app.image.base-url=${APP_IMAGE_BASE_URL:http://localhost:8080/images}
spring.web.resources.static-locations=file:${app.image.upload-dir}/
spring.mvc.static-path-pattern=/images/**
app.readonly=${APP_READONLY:false}
app.user-codes=${USER_CODES:}

# Access-token signing.
# AUTH_JWT_SECRET must be a Base64-encoded value with at least 32 decoded bytes.
app.auth.jwt.issuer=${AUTH_JWT_ISSUER:octopus-api}
app.auth.jwt.audience=${AUTH_JWT_AUDIENCE:octopus-browser}
app.auth.jwt.access-token-ttl=${AUTH_ACCESS_TOKEN_TTL:15m}
app.auth.jwt.secret=${AUTH_JWT_SECRET:dGhpcy1pcy1hLXRlc3Qtc2VjcmV0LWtleS1mb3ItamF2YS1vY3RvcHVzLWp3dC1zZWNyZXQ=}
app.auth.refresh-token.ttl=${AUTH_REFRESH_TOKEN_TTL:14d}
app.auth.refresh-token.cookie.name=${AUTH_REFRESH_COOKIE_NAME:refresh_token}
app.auth.refresh-token.cookie.secure=${AUTH_REFRESH_COOKIE_SECURE:false}
app.auth.refresh-token.cookie.same-site=${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
app.auth.refresh-token.cookie.path=${AUTH_REFRESH_COOKIE_PATH:/api/v1/auth}
app.auth.refresh-token.cookie.domain=${AUTH_REFRESH_COOKIE_DOMAIN:}

#for data.sql
spring.sql.init.mode=never
