spring.application.name=octopus
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:dimitris}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.image.upload-dir=${APP_IMAGE_UPLOAD_DIR:S:/temp}
app.image.base-url=${APP_IMAGE_BASE_URL:http://localhost:8080/images}
spring.web.resources.static-locations=file:${app.image.upload-dir}/
spring.mvc.static-path-pattern=/images/**
app.readonly=${APP_READONLY:false}
app.helper-codes=${HELPER_CODES:}

#for data.sql
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true