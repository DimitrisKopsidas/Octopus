name: octopus

services:
  db:
    image: postgres:16
    ports:
      - "5432:5432"
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      - db
    env_file:
      - .env
    restart: on-failure
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_IMAGE_UPLOAD_DIR: ${APP_IMAGE_UPLOAD_DIR}
      APP_IMAGE_BASE_URL: ${APP_IMAGE_BASE_URL}
      APP_READONLY: ${APP_READONLY}
    volumes:
      - /var/www/octopus/images:/var/www/octopus/images

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "80:80"
    volumes:
      - /var/www/octopus/images:/var/www/octopus/images
    depends_on:
      - backend

volumes:
  postgres_data: