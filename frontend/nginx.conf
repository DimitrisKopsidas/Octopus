log_format rate_limit '$remote_addr - $host "$request" $status '
                      'xff="$http_x_forwarded_for" '
                      'limit="$limit_req_status"';

map "$request_method:$uri" $login_limit_key {
    default                      "";
    "POST:/api/v1/auth/login"   $binary_remote_addr;
}

limit_req_zone $login_limit_key zone=login_per_ip:10m rate=10r/m;

server {
    listen 80;

    access_log /var/log/nginx/access.log rate_limit;
    limit_req_status 429;

    limit_req_dry_run on;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /api/ {
        limit_req zone=login_per_ip burst=10 nodelay;

        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /images/ {
            alias /var/www/octopus/images/;
        }
}
