log_format rate_limit 'client="$remote_addr" peer="$realip_remote_addr" '
                      '$host "$request" $status '
                      'xff="$http_x_forwarded_for" '
                      'limit="$limit_req_status"';

map "$request_method:$uri" $rate_limit_key {
    default                      "";
    "POST:/api/v1/auth/login"   $binary_remote_addr;
    "POST:/api/v1/auth/register" $binary_remote_addr;
    "POST:/api/v1/auth/refresh"  $binary_remote_addr;
}

# Rate limit Zone A. Memory 10mb, rate 10 requests per minute
limit_req_zone $rate_limit_key zone=login_per_ip:10m rate=60r/m;

server {
    listen 80;
    
    set_real_ip_from 172.18.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    access_log /var/log/nginx/access.log rate_limit;
    limit_req_status 429;

    limit_req_dry_run off;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /api/ {
        limit_req zone=login_per_ip burst=10 nodelay;

        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /images/ {
            alias /var/www/octopus/images/;
        }
}
